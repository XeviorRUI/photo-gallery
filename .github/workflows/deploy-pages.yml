name: Deploy gallery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # The image pipeline uses System.Drawing (GDI+) and ImageCodecInfo. Those
      # types live in the .NET Framework assemblies that Windows PowerShell 5.1
      # provides; PowerShell 7 only has a facade that forwards to a separate
      # System.Drawing.Common package. Use the supported host here.
      - name: Build deployment directory
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./build.ps1

      - name: Validate geometry, loading and build protection
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          node --test tests/core.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/build.tests.ps1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
